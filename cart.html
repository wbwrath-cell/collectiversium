<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Košík – Collectiversium</title>
<!-- Obsah košíku je pro každého jiný — do vyhledávání nepatří. -->
<meta name="robots" content="noindex, follow" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header id="site-header" class="site"></header>

<section class="section container">
  <div class="section-head">
    <div>
      <span class="kicker">Objednávka</span>
      <h2>Košík</h2>
    </div>
  </div>
  <div id="cart-root"></div>
</section>

<footer id="site-footer" class="site"></footer>

<script src="/js/data.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/site.js"></script>
<script>
  // Pokladna zatím neběží přes bránu — souhrn košíku pošleme e-mailem.
  function orderMailto(items) {
    const lines = items.map((it) => `${it.qty}x ${it.p.name} — ${formatPrice(it.p.price * it.qty)}`).join("\n");
    const body = `Dobrý den,\n\nrád/a bych objednal/a:\n\n${lines}\n\nDěkuji.`;
    return "mailto:" + CONTACT_EMAIL + "?subject=" + encodeURIComponent("Objednávka z košíku") + "&body=" + encodeURIComponent(body);
  }

  function renderCart() {
    const cart = readCart();
    const ids = Object.keys(cart);
    const root = document.getElementById("cart-root");

    if (!ids.length) {
      root.innerHTML = `
        <div class="empty-state">
          <div class="big">Prázdno</div>
          <p>V košíku zatím nic není</p>
          <a class="btn" href="/products.html">Prohlédnout nabídku</a>
        </div>`;
      return;
    }

    const items = ids.map((id) => ({ p: getProduct(id), qty: cart[id] })).filter((it) => it.p);
    // Doprava je plošně zahrnutá v ceně položky — žádný samostatný poplatek k připočítání.
    const total = items.reduce((sum, it) => sum + it.p.price * it.qty, 0);

    root.innerHTML = `
      <div class="cart-layout">
        <div class="cart-table-wrap">
        <table class="cart-table">
          <thead><tr><th>Produkt</th><th>Cena</th><th>Množství</th><th>Mezisoučet</th><th></th></tr></thead>
          <tbody>
            ${items
              .map(
                (it) => `
              <tr>
                <td>
                  <div class="cart-item-info">
                    <div class="cart-thumb" style="${franchiseStyle(it.p.franchise)}"></div>
                    <div>
                      <div class="name"><a href="/produkt/${it.p.id}.html">${it.p.name}</a></div>
                      <div class="brand">${it.p.franchise} · ${it.p.type}</div>
                    </div>
                  </div>
                </td>
                <td class="num">${formatPrice(it.p.price)}</td>
                <td>
                  <div class="qty-box">
                    <button onclick="setQty('${it.p.id}', ${it.qty - 1}); renderCart();">−</button>
                    <input value="${it.qty}" onchange="setQty('${it.p.id}', parseInt(this.value)||1); renderCart();" />
                    <button onclick="setQty('${it.p.id}', ${it.qty + 1}); renderCart();">+</button>
                  </div>
                </td>
                <td class="num">${formatPrice(it.p.price * it.qty)}</td>
                <td><span class="remove-link" onclick="removeFromCart('${it.p.id}'); renderCart();">Odebrat</span></td>
              </tr>`
              )
              .join("")}
          </tbody>
        </table>
        </div>

        <div class="summary-box">
          <h3>Souhrn objednávky</h3>
          <div class="summary-row"><span>Doprava</span><span>Zahrnuta v ceně</span></div>
          <div class="summary-row total"><span>Celkem</span><span>${formatPrice(total)}</span></div>
          <p style="font-size:12px;color:var(--text-dim);margin-top:6px;">Konečná částka v CZK. Prodávající není plátcem DPH, částka je bez DPH.</p>
          <a class="btn" style="width:100%;margin-top:16px;display:block;text-align:center;" href="${orderMailto(items)}">Dokončit objednávku e-mailem</a>
          <p style="font-size:12px;color:var(--text-dim);margin-top:10px;">Objednávku dokončíme e-mailem — ozveme se vám s potvrzením a platebními údaji. Jednotlivé položky lze zaplatit i rovnou tlačítkem <b>Koupit</b> na detailu produktu.</p>
        </div>
      </div>`;
  }

  renderCart();
</script>

</body>
</html>
