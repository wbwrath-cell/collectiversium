<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Přesměrování – Collectiversium</title>
<meta name="robots" content="noindex, follow" />
<link rel="stylesheet" href="/css/style.css" />
<script>
  // Historická URL. Detaily produktů se přesunuly na /produkt/<id>.html,
  // aby každý produkt měl vlastní indexovatelnou stránku. Staré odkazy
  // (záložky, sdílené linky) tu překlopíme na novou adresu.
  (function () {
    var id = new URLSearchParams(window.location.search).get("id");
    window.location.replace(id ? "/produkt/" + encodeURIComponent(id) + ".html" : "/products.html");
  })();
</script>
</head>
<body>
<div class="container" style="padding:80px 0;">
  <div class="empty-state">
    <div class="big">◌</div>
    <p>Přesměrováváme vás na detail produktu…</p>
    <a class="btn" href="/products.html">Zpět do katalogu</a>
  </div>
</div>
</body>
</html>
